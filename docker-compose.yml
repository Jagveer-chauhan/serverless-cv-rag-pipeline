version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - SUPABASE_DB_URL=${SUPABASE_DB_URL:-postgresql+asyncpg://postgres:postgres@db:5432/postgres}
      - HF_API_KEY=${HF_API_KEY:-}
      - HF_MODEL_NAME=google/gemma-3-4b-it
      - SLA_TARGET_MS=5000.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
